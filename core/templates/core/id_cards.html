<!DOCTYPE html>
<html>
<head>
    <title>ID Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h3>Student ID Cards</h3>
        <button onclick="window.print()" class="btn btn-primary">Print All ID Cards</button>
    </div>
    <div class="row g-3">
        {% for s in students %}
        <div class="col-md-4">
            <div class="card p-3 border-primary shadow-sm text-center">
                <h5 class="fw-bold text-primary">Guru Nanak School</h5>
                <hr class="my-1">
                <h6>{{ s.student_name }}</h6>
                <p class="small text-muted mb-1">Reg No: {{ s.registration_no }} | Class: {{ s.student_class }}</p>
                <p class="small mb-0">Father: {{ s.father_name }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
