<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container bg-white p-4 rounded shadow-sm">
    <h3 class="fw-bold mb-4">New Staff Registration</h3>
    <form method="POST">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-4"><label>Employee Name *</label><input type="text" name="employee_name" class="form-control" required></div>
            <div class="col-md-4"><label>Mobile No *</label><input type="text" name="mobile_no" class="form-control" required></div>
            <div class="col-md-4"><label>Role *</label><input type="text" name="role" class="form-control" placeholder="Teacher/Staff" required></div>
            <div class="col-md-6"><label>Father / Husband Name</label><input type="text" name="father_husband_name" class="form-control"></div>
            <div class="col-md-6"><label>Email</label><input type="email" name="email" class="form-control"></div>
        </div>
        <button type="submit" class="btn btn-success mt-4 w-100">Save Employee</button>
    </form>
</div>
</body>
</html>
