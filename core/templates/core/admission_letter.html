<!DOCTYPE html>
<html>
<head>
    <title>Admission Letter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container bg-white p-4 rounded text-center shadow-sm" style="max-width: 600px;">
    <h4>Generate Admission Letter</h4>
    <form method="GET" class="d-flex gap-2 my-3">
        <input type="text" name="search" class="form-control" placeholder="Search by name or reg no..." value="{{ query }}">
        <button class="btn btn-primary">Search</button>
    </form>
    {% if student %}
    <div class="border p-4 text-start mt-4 rounded">
        <h3 class="text-center text-success">Admission Confirmation Letter</h3>
        <hr>
        <p><strong>Student Name:</strong> {{ student.student_name }}</p>
        <p><strong>Reg No:</strong> {{ student.registration_no }}</p>
        <p><strong>Class:</strong> {{ student.student_class }}</p>
        <p><strong>Date of Admission:</strong> {{ student.date_of_admission }}</p>
        <button onclick="window.print()" class="btn btn-success w-100 mt-3">Print Letter</button>
    </div>
    {% endif %}
</div>
</body>
</html>
