<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container bg-white p-4 rounded shadow-sm">
    <h3 class="fw-bold mb-3">Mark Student Attendance</h3>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3 col-md-4">
            <label>Select Date</label>
            <input type="date" name="date" class="form-control" required>
        </div>
        <table class="table table-bordered">
            <thead><tr><th>Student</th><th>Class</th><th>Status</th></tr></thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.student_name }}</td>
                    <td>{{ s.student_class }}</td>
                    <td>
                        <select name="status_{{ s.id }}" class="form-select">
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Leave">Leave</option>
                        </select>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <button type="submit" class="btn btn-primary w-100">Submit Attendance</button>
    </form>
</div>
</body>
</html>
