<!DOCTYPE html>
<html>
<head>
    <title>Transport Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">
{% include "core/header.html" %}
<div class="container bg-white p-4 rounded shadow-sm">
    <h3 class="fw-bold mb-4"><i class="bi bi-bus-front text-dark"></i> Bus Routes & Transport</h3>

    <form method="POST" class="row g-2 mb-4 p-3 bg-light rounded border">
        {% csrf_token %}
        <div class="col-md-3"><input type="text" name="route_name" class="form-control" placeholder="Route Name" required></div>
        <div class="col-md-3"><input type="text" name="vehicle_number" class="form-control" placeholder="Bus Number" required></div>
        <div class="col-md-2"><input type="text" name="driver_name" class="form-control" placeholder="Driver Name" required></div>
        <div class="col-md-2"><input type="text" name="driver_contact" class="form-control" placeholder="Driver Phone" required></div>
        <div class="col-md-2"><input type="number" name="monthly_fee" class="form-control" placeholder="Monthly Fee" value="1000"></div>
        <div class="col-md-12 mt-2"><button type="submit" class="btn btn-dark w-100">Add Route</button></div>
    </form>

    <table class="table table-bordered">
        <thead class="table-dark"><tr><th>Route</th><th>Bus No</th><th>Driver Name</th><th>Driver Phone</th><th>Monthly Fee</th></tr></thead>
        <tbody>
            {% for r in routes %}
            <tr><td>{{ r.route_name }}</td><td>{{ r.vehicle_number }}</td><td>{{ r.driver_name }}</td><td>{{ r.driver_contact }}</td><td>₹ {{ r.monthly_fee }}</td></tr>
            {% empty %}<tr><td colspan="5" class="text-center text-muted">No routes added.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
