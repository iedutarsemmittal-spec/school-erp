<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container-fluid bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between mb-3">
        <h4>Student Directory</h4>
        <div>
            <button onclick="window.print()" class="btn btn-secondary">Print / Export PDF</button>
            <a href="/add-student/" class="btn btn-primary">+ Add New</a>
        </div>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr><th>Reg #</th><th>Student Name</th><th>Father Name</th><th>Class</th><th>Mobile</th></tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr><td>{{ s.registration_no }}</td><td>{{ s.student_name }}</td><td>{{ s.father_name }}</td><td>{{ s.student_class }}</td><td>{{ s.mobile_for_sms }}</td></tr>
            {% empty %}
            <tr><td colspan="5" class="text-center">No Record Found</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
