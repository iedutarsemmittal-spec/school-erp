<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bulk Upload Students - Guru Nanak Sr Sec School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold m-0"><i class="bi bi-file-earmark-excel text-success me-2"></i>Bulk Excel Upload</h4>
        <a href="/students/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="alert alert-info">
        <strong>Excel Format Guidelines:</strong>
        <p class="mb-0 small">Aapki Excel sheet me ye Headers hone chahiye:</p>
        <code class="d-block mt-1">first_name | last_name | roll_number | student_class | section | contact_number</code>
    </div>

    <form method="POST" enctype="multipart/form-data" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Select Excel File (.xlsx / .xls)</label>
            <input type="file" name="excel_file" class="form-control" accept=".xlsx, .xls" required>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold"><i class="bi bi-upload me-1"></i> Upload & Import Students</button>
    </form>
</div>

</body>
</html>
